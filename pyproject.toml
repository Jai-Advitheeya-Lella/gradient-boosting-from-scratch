[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbdt-from-scratch"
version = "0.1.0"
description = "XGBoost-style second-order histogram gradient boosting in NumPy + Numba"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "numba", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
